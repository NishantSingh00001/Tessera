[build]
  command = "npm run build"
  publish = "dist"

# Hardened delivery: a strict Content-Security-Policy and the usual security
# headers. Scripts load only from this origin; styles and fonts come from
# Google Fonts; the page can't be framed.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# SPA fallback — the app is client-routed, but the API paths are real functions.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
